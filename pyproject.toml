[project]
name = "xpoint-cfi"
version = "0.1.0"
description = "Convert KOReader (crengine) xpointers to EPUB CFI and back"
readme = "README.md"
authors = [
    { name = "Tuomas Salmi", email = "salmi.tuomas@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pyright>=1.1",
    "lxml-stubs>=0.5",
    "lupa>=2.0",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests", "validation"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "corpus: real-book validation tests over test-books/ (skipped when the corpus is absent)",
]
